"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 100
palette = "matugen"

# ==================================================
# FORMATO PRINCIPAL (Corregido el llamado al Kernel)
# ==================================================
format = "[┌─](fg:outline) $username$directory$time${env_var.OS_KERNEL}$git_branch$git_status$nodejs$python$c$cpp$rust$java$golang$ruby$php\n[└─](fg:outline) $character"

# ==================================================
# PALETA DE COLORES (Variables para Matugen)
# ==================================================
[palettes.matugen]
primary = "#b2d0ee"
on_primary = "#13334b"
secondary = "#bdc8d5"
on_secondary = "#27313c"
tertiary = "#f1c591"
on_tertiary = "#452b04"
error = "#ffb4ab"
on_error = "#690005"
surface = "#121315"
on_surface = "#e3e2e4"
surface_variant = "#43474d"
on_surface_variant = "#c3c7cd"
outline = "#8d9197"
shadow = "#000000"
hover = "#cee5ff"
on_hover = "#001d32"

# ==================================================
# BLOQUES BÁSICOS
# ==================================================
[username]
show_always = true
style_user = "bg:surface_variant fg:primary"
style_root = "bg:error fg:on_error"
format = '[ $user ]($style) '
disabled = false

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bg:primary fg:on_primary bold"
read_only = ' 󰌾'
read_only_style = "bg:primary fg:error"
format = '[ $path$read_only ]($style)  ' 

[time]
disabled = false
time_format = "%I:%M %p"
style = "fg:primary bold"
format = '[$time]($style)  ' 

[env_var.OS_KERNEL]
variable = "OS_KERNEL"
style = "bg:primary fg:on_primary bold"
format = '[ $env_value ]($style) '

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol   = "[❯](bold fg:error)"

# ==================================================
# GIT
# ==================================================
[git_branch]
style = "bg:tertiary fg:on_tertiary"
format = '[ $symbol$branch ]($style) '

[git_status]
style = "bg:tertiary fg:on_tertiary"
format = '([$all_status$ahead_behind]($style) )'

# ==================================================
# ENTORNOS Y LENGUAJES
# ==================================================
[nodejs]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

[python]
style = "bg:primary fg:on_primary"
format = '[ ${symbol}${pyenv_prefix}(${version} )]($style) '

[java]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

[c]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

[cpp]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

[rust]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

[golang]
style = "bg:primary fg:on_primary"
format = '[ $symbol$version ]($style) '

