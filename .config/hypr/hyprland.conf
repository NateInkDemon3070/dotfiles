# Monitor
monitor=,1366x768,auto,1

# Variables (convertido desde Sway)
$term = kitty
$menu = rofi -show drun -display-drun " APPS"
$mainMod = SUPER

# Entorno
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = HYPRSHOT_DIR,/home/jpablo/Imagenes/Capturas

# Autostart (convertido desde Sway: exec → exec-once)
exec-once = bash /home/jpablo/.config/sway/scripts/autostart.sh
exec-once = runsvdir /home/jpablo/.config/runit/sv
exec-once = bash /home/jpablo/.config/sway/scripts/sway-config-watcher.sh
exec-once = bash /home/jpablo/.config/sway/scripts/start-matugen.sh
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = dbus-update-activation-environment --all
exec-once = /usr/bin/dbus-launch --exit-with-session
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = swaync
exec-once = hyprctl setcursor breeze_cursors 24

# Input (convertido desde Sway)
input {
    kb_layout = us
    kb_variant = intl
    kb_options = lv3:lalt_switch
    follow_mouse = 1
    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}

# General (convertido desde Sway)
general {
    resize_on_border = true
    extend_border_grab_area = 20
    hover_icon_on_border = true
    gaps_in = 5
    gaps_out = 10
    border_size = 0
    col.active_border = rgba(00000000)
    col.inactive_border = rgba(00000000)
}

decoration {
    rounding = 0
    active_opacity = 0.9
    inactive_opacity = 0.8

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
        ignore_opacity = true
        xray = false
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    bezier = smooth,   0.4,  0.0,  0.2,  1.0
    bezier = snappy,   0.05, 0.9,  0.1,  1.05
    bezier = fastOut,  0.0,  0.0,  0.2,  1.0

    animation = windows,      1, 3, snappy,  popin 85%
    animation = windowsOut,   1, 2, fastOut, popin 85%
    animation = windowsMove,  1, 3, smooth,  slide

    animation = layers,       1, 2, smooth,  fade
    animation = fade,         1, 3, smooth
    animation = border,       1, 2, smooth
    animation = workspaces,   1, 3, smooth,  slide
}

# Window rules (convertido desde Sway for_window)
windowrule = float on, match:class ^(rofi_terminal)$
windowrule = size 600 400, match:class ^(rofi_terminal)$
windowrule = center on, match:class ^(rofi_terminal)$
windowrule = opacity 0.9, match:class ^(rofi_terminal)$

windowrule = float on, match:class ^(floating_tui)$
windowrule = size 700 500, match:class ^(floating_tui)$
windowrule = center on, match:class ^(floating_tui)$

windowrule = float on, match:class ^(pavucontrol)$
windowrule = size 800 600, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$

windowrule = float on, match:class ^(blueman-manager)$
windowrule = size 600 400, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(blueman-manager)$

windowrule = opacity 0.85, match:class ^(librewolf)$
windowrule = opacity 0.85, match:class ^(Vesktop|vesktop)$
windowrule = opacity 0.85, match:class ^(zapzap)$

# Keybinds (convertido desde Sway bindsym)
bind = $mainMod, Return, exec, $term
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, kitty -e yazi
bind = $mainMod, B, exec, librewolf
bind = $mainMod, M, exec, kitty -e rmpc
bind = $mainMod, N, exec, bash /home/jpablo/.config/sway/scripts/mpd-rofi.sh
bind = $mainMod, T, togglefloating
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod, C, exec, hyprctl reload
bind = $mainMod, Escape, exec, bash ~/.config/sway/scripts/powermenu.sh
bind = $mainMod SHIFT, E, exec, kitty -e doas yazi
bind = $mainMod, period, exec, rofimoji --action copy
bind = $mainMod, W, exec, sh /home/jpablo/.config/sway/scripts/wallpaper.sh
bind = $mainMod SHIFT, W, exec, bash /home/jpablo/.config/sway/scripts/wallpaper_select.sh
bind = $mainMod, O, exec, bash /home/jpablo/.config/waybar/scripts/switch_waybar.sh
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Navegación (convertido desde Sway)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod CTRL, left, moveactive, -40 0
bind = $mainMod CTRL, right, moveactive, 40 0
bind = $mainMod CTRL, up, moveactive, 0 -40
bind = $mainMod CTRL, down, moveactive, 0 40

# Workspaces (convertido desde Sway)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Modo resize (convertido desde Sway mode resize)
bind = $mainMod, R, submap, resize
submap = resize
bind = , left, resizeactive, -10 0
bind = , right, resizeactive, 10 0
bind = , up, resizeactive, 0 -10
bind = , down, resizeactive, 0 10
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# Mouse (convertido desde floating_modifier)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia (convertido desde Sway)
binde = , XF86AudioRaiseVolume, exec, /home/jpablo/.local/bin/swayosd-client --output-volume raise && pkill -RTMIN+1 waybar
binde = , XF86AudioLowerVolume, exec, /home/jpablo/.local/bin/swayosd-client --output-volume lower && pkill -RTMIN+1 waybar
bind  = , XF86AudioMute, exec, /home/jpablo/.local/bin/swayosd-client --output-volume mute-toggle && pkill -RTMIN+1 waybar
bind  = , XF86AudioMicMute, exec, /home/jpablo/.local/bin/swayosd-client --input-volume mute-toggle && pkill -RTMIN+1 waybar
binde = , XF86MonBrightnessUp, exec, /home/jpablo/.local/bin/swayosd-client --brightness raise && pkill -RTMIN+1 waybar
binde = , XF86MonBrightnessDown, exec, /home/jpablo/.local/bin/swayosd-client --brightness lower && pkill -RTMIN+1 waybar

# Capturas (convertido desde Sway)
bind = , Print, exec, /home/jpablo/.config/sway/scripts/grimshot-save.sh screen
bind = $mainMod, Print, exec, grimshot --notify copy screen
bind = SHIFT, Print, exec, /home/jpablo/.config/sway/scripts/grimshot-save.sh area
bind = $mainMod SHIFT, Print, exec, /home/jpablo/.config/sway/scripts/grimshot-save.sh area
bind = $mainMod CTRL, Print, exec, /home/jpablo/.config/sway/scripts/grimshot-save.sh active

# Colores de Matugen (convertido desde include de Sway)
source = ~/.config/hypr/colors-hyprland.conf

# Modo juego (convertido desde include de Sway)
source = ~/.config/hypr/gamemode.conf
