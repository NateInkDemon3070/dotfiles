# : Manager [[[

[mgr]
cwd = { fg = "#e2e2e9" }

# Find
find_keyword  = { fg = "#fabc48", bold = true, italic = true, underline = true }
find_position = { fg = "#fabc48", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#b0c6ff", bg = "#b0c6ff" }
marker_cut      = { fg = "#b8c6ed", bg = "#b8c6ed" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#fabc48", bg = "#fabc48" }

# Count
count_copied   = { fg = "#002d6e", bg = "#b0c6ff" }
count_cut      = { fg = "#22304f", bg = "#b8c6ed" }
count_selected = { fg = "#422c00", bg = "#fabc48" }

# Border
border_symbol = "│"
border_style  = { fg = "#8d909d" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "", close = "" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#b0c6ff", bold = true, bg = "#111319" }
inactive  = { fg = "#c3c6d3", bg = "#111319" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#b0c6ff", fg = "#002d6e", bold = true }
normal_alt  = { bg = "#434652", fg = "#c3c6d3" }

# Select mode
select_main = { bg = "#b8c6ed", fg = "#22304f", bold = true }
select_alt  = { bg = "#434652", fg = "#c3c6d3" }

# Unset mode
unset_main = { bg = "#fabc48", fg = "#422c00", bold = true }
unset_alt  = { bg = "#434652", fg = "#c3c6d3" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type  = { fg = "#fabc48" }
perm_write = { fg = "#b0c6ff" }
perm_read  = { fg = "#ffb4ab" }
perm_exec  = { fg = "#b8c6ed" }
perm_sep   = { fg = "#8d909d" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#b0c6ff", bg = "#434652" }
progress_error  = { fg = "#ffb4ab", bg = "#434652" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#434652" }
cand = { fg = "#b0c6ff" }
rest = { fg = "#000000" }
desc = { fg = "#e2e2e9" }
separator = " ▶ "
separator_style = { fg = "#e2e2e9" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#b8c6ed" }
title_warn  = { fg = "#fabc48" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#8d909d" }
active = { fg = "#b0c6ff", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#8d909d" }
value  = { fg = "#e2e2e9" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#8d909d", bg = "#111319" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#8d909d" }
title   = {}
hovered = { fg = "#b0c6ff", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e2e2e9" }
run    = { fg = "#e2e2e9" }
footer = { fg = "#22304f", bg = "#b8c6ed" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#fabc48" },

    # Media
    { mime = "{audio,video}/*", fg = "#b8c6ed" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#b0c6ff" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffb4ab" },

    # Fallback
    { url = "*", fg = "#e2e2e9" },
    { url = "*/", fg = "#b0c6ff" },
]

# : ]]]


