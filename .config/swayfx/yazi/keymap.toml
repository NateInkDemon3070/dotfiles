# --- Compression ---
[[mgr.prepend_keymap]]
on   = [ "c", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

# --- Chmod ---
[[mgr.prepend_keymap]]
on   = [ "c", "m" ]
run  = "plugin chmod"
desc = "Chmod on selected files"

# --- Abrir terminal aqui ---
[[mgr.prepend_keymap]]
on   = [ "t" ]
run  = "shell 'foot -D \"$PWD\"'"
desc = "Open terminal here"

# --- cd interactivo ---
[[mgr.prepend_keymap]]
on   = [ "<C-Space>" ]
run  = "cd --interactive"
desc = "Go to directory"

# --- Abrir archivo con fzf (nvim) ---
[[mgr.prepend_keymap]]
on   = [ "z" ]
run  = "shell --block 'sh /home/jpablo/.config/yazi/fzf-open.sh \"$(fzf --preview \"sh /home/jpablo/.config/yazi/fzf-preview.sh {}\")\"'"
desc = "Open file with fzf in nvim"
