# fuzzel — equivalente a ~/.config/rofi/config.rasi
# Generado por matugen desde ~/.config/matugen/templates/fuzzel.ini
# No edites ~/.config/fuzzel/fuzzel.ini: edita esta plantilla.

[main]
# Tipografía y tamaño (rofi usaba Iosevka Nerd Font 8.5)
font=Iosevka Nerd Font:size=8.5

# Textos
# Las comillas conservan los espacios finales: separan " APPS" del campo de búsqueda.
prompt=" APPS   "
placeholder=Buscar...

# Iconos de aplicaciones (rofi: show-icons: true)
icons-enabled=yes
# Usar el mismo tema de iconos del escritorio (Tela-circle-nord), como hacía rofi
icon-theme=Tela-circle-nord

# Búsqueda: rofi busca en nombre, genérico, exec, categorías, keywords y comentario
fields=name,generic,exec,categories,keywords,comment
match-mode=fzf

# Aplicaciones que necesitan terminal (rofi las abría con la terminal del sistema)
terminal=kitty -e

# Ventana: 380px aprox. en rofi -> 56 columnas con esta fuente
width=56
lines=7
horizontal-pad=20
vertical-pad=10
inner-pad=8
line-height=22px

# Posición y capa (rofi: location center / anchor center)
anchor=center
layer=overlay
# Namespace de la capa, usado por la layer_rule de mangowc
namespace=fuzzel
keyboard-focus=exclusive

# Comportamiento
show-actions=no
match-counter=no
hide-before-typing=no
auto-select=no
filter-desktop=no

[border]
# rofi: border 2px, border-radius 0
width=2
radius=0
selection-radius=0

[colors]
# Paleta equivalente a ~/.cache/wal/colors-rofi-dark.rasi
# Fondo: rofi usaba rgba(15, 17, 20, 0.85); usamos surface_dim con alpha 0.85
background={{colors.surface_dim.default.hex_stripped}}d9

# Texto normal (rofi: #FFFFFF)
text=ffffffff
message=ffffffff
input=ffffffff
placeholder=ffffffff

# Acento (rofi: @accent-text -> primary)
prompt={{colors.primary.default.hex_stripped}}ff
match={{colors.primary.default.hex_stripped}}ff

# Selección (rofi: selected-normal-background -> primary_container)
selection={{colors.primary_container.default.hex_stripped}}ff
selection-text=ffffffff
selection-match={{colors.primary.default.hex_stripped}}ff

# Contador de coincidencias
counter={{colors.on_surface_variant.default.hex_stripped}}ff

# Borde de ventana (rofi: @accent-alt -> selected-normal-background)
border={{colors.primary_container.default.hex_stripped}}ff

[dmenu]
# No abrir la ventana si el menú no tiene entradas
exit-immediately-if-empty=yes
