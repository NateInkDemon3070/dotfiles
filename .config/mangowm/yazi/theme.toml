# : Manager [[[

[mgr]
cwd = { fg = "#e4e2e4" }

# Find
find_keyword  = { fg = "#dec397", bold = true, italic = true, underline = true }
find_position = { fg = "#dec397", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#bcc6e3", bg = "#bcc6e3" }
marker_cut      = { fg = "#c3c6d3", bg = "#c3c6d3" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#dec397", bg = "#dec397" }

# Count
count_copied   = { fg = "#263047", bg = "#bcc6e3" }
count_cut      = { fg = "#2d303a", bg = "#c3c6d3" }
count_selected = { fg = "#3e2e0e", bg = "#dec397" }

# Border
border_symbol = "│"
border_style  = { fg = "#8f9097" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "", close = "" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#bcc6e3", bold = true, bg = "#131315" }
inactive  = { fg = "#c6c6cd", bg = "#131315" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#bcc6e3", fg = "#263047", bold = true }
normal_alt  = { bg = "#45464d", fg = "#c6c6cd" }

# Select mode
select_main = { bg = "#c3c6d3", fg = "#2d303a", bold = true }
select_alt  = { bg = "#45464d", fg = "#c6c6cd" }

# Unset mode
unset_main = { bg = "#dec397", fg = "#3e2e0e", bold = true }
unset_alt  = { bg = "#45464d", fg = "#c6c6cd" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type  = { fg = "#dec397" }
perm_write = { fg = "#bcc6e3" }
perm_read  = { fg = "#ffb4ab" }
perm_exec  = { fg = "#c3c6d3" }
perm_sep   = { fg = "#8f9097" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#bcc6e3", bg = "#45464d" }
progress_error  = { fg = "#ffb4ab", bg = "#45464d" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#45464d" }
cand = { fg = "#bcc6e3" }
rest = { fg = "#000000" }
desc = { fg = "#e4e2e4" }
separator = " ▶ "
separator_style = { fg = "#e4e2e4" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#c3c6d3" }
title_warn  = { fg = "#dec397" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#8f9097" }
active = { fg = "#bcc6e3", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#8f9097" }
value  = { fg = "#e4e2e4" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#8f9097", bg = "#131315" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#8f9097" }
title   = {}
hovered = { fg = "#bcc6e3", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e4e2e4" }
run    = { fg = "#e4e2e4" }
footer = { fg = "#2d303a", bg = "#c3c6d3" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#dec397" },

    # Media
    { mime = "{audio,video}/*", fg = "#c3c6d3" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#bcc6e3" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffb4ab" },

    # Fallback
    { url = "*", fg = "#e4e2e4" },
    { url = "*/", fg = "#bcc6e3" },
]

# : ]]]


