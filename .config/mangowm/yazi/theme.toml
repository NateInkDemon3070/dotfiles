# : Manager [[[

[mgr]
cwd = { fg = "#e4e2de" }

# Find
find_keyword  = { fg = "#e6c4d7", bold = true, italic = true, underline = true }
find_position = { fg = "#e6c4d7", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#c5d2b1", bg = "#c5d2b1" }
marker_cut      = { fg = "#c4c8b9", bg = "#c4c8b9" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#e6c4d7", bg = "#e6c4d7" }

# Count
count_copied   = { fg = "#2a341d", bg = "#c5d2b1" }
count_cut      = { fg = "#2e3227", bg = "#c4c8b9" }
count_selected = { fg = "#402a38", bg = "#e6c4d7" }

# Border
border_symbol = "│"
border_style  = { fg = "#909288" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "", close = "" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#c5d2b1", bold = true, bg = "#131411" }
inactive  = { fg = "#c6c7bd", bg = "#131411" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#c5d2b1", fg = "#2a341d", bold = true }
normal_alt  = { bg = "#45483f", fg = "#c6c7bd" }

# Select mode
select_main = { bg = "#c4c8b9", fg = "#2e3227", bold = true }
select_alt  = { bg = "#45483f", fg = "#c6c7bd" }

# Unset mode
unset_main = { bg = "#e6c4d7", fg = "#402a38", bold = true }
unset_alt  = { bg = "#45483f", fg = "#c6c7bd" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type  = { fg = "#e6c4d7" }
perm_write = { fg = "#c5d2b1" }
perm_read  = { fg = "#ffb4ab" }
perm_exec  = { fg = "#c4c8b9" }
perm_sep   = { fg = "#909288" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#c5d2b1", bg = "#45483f" }
progress_error  = { fg = "#ffb4ab", bg = "#45483f" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#45483f" }
cand = { fg = "#c5d2b1" }
rest = { fg = "#202914" }
desc = { fg = "#e4e2de" }
separator = " ▶ "
separator_style = { fg = "#e4e2de" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#c4c8b9" }
title_warn  = { fg = "#e6c4d7" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#909288" }
active = { fg = "#c5d2b1", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#909288" }
value  = { fg = "#e4e2de" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#909288", bg = "#131411" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#909288" }
title   = {}
hovered = { fg = "#c5d2b1", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e4e2de" }
run    = { fg = "#e4e2de" }
footer = { fg = "#2e3227", bg = "#c4c8b9" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#e6c4d7" },

    # Media
    { mime = "{audio,video}/*", fg = "#c4c8b9" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#c5d2b1" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffb4ab" },

    # Fallback
    { url = "*", fg = "#e4e2de" },
    { url = "*/", fg = "#c5d2b1" },
]

# : ]]]


