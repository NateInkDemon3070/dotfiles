# : Manager [[[

[mgr]
cwd = { fg = "#eae0e4" }

# Find
find_keyword  = { fg = "#b3d186", bold = true, italic = true, underline = true }
find_position = { fg = "#b3d186", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#f3b2e5", bg = "#f3b2e5" }
marker_cut      = { fg = "#debdd4", bg = "#debdd4" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#b3d186", bg = "#b3d186" }

# Count
count_copied   = { fg = "#4d1e48", bg = "#f3b2e5" }
count_cut      = { fg = "#3f293b", bg = "#debdd4" }
count_selected = { fg = "#213600", bg = "#b3d186" }

# Border
border_symbol = "│"
border_style  = { fg = "#9b8d95" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "", close = "" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#f3b2e5", bold = true, bg = "#171215" }
inactive  = { fg = "#d2c2cb", bg = "#171215" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#f3b2e5", fg = "#4d1e48", bold = true }
normal_alt  = { bg = "#4f444b", fg = "#d2c2cb" }

# Select mode
select_main = { bg = "#debdd4", fg = "#3f293b", bold = true }
select_alt  = { bg = "#4f444b", fg = "#d2c2cb" }

# Unset mode
unset_main = { bg = "#b3d186", fg = "#213600", bold = true }
unset_alt  = { bg = "#4f444b", fg = "#d2c2cb" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type  = { fg = "#b3d186" }
perm_write = { fg = "#f3b2e5" }
perm_read  = { fg = "#ffb4ab" }
perm_exec  = { fg = "#debdd4" }
perm_sep   = { fg = "#9b8d95" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#f3b2e5", bg = "#4f444b" }
progress_error  = { fg = "#ffb4ab", bg = "#4f444b" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#4f444b" }
cand = { fg = "#f3b2e5" }
rest = { fg = "#000000" }
desc = { fg = "#eae0e4" }
separator = " ▶ "
separator_style = { fg = "#eae0e4" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#debdd4" }
title_warn  = { fg = "#b3d186" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#9b8d95" }
active = { fg = "#f3b2e5", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#9b8d95" }
value  = { fg = "#eae0e4" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#9b8d95", bg = "#171215" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#9b8d95" }
title   = {}
hovered = { fg = "#f3b2e5", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#eae0e4" }
run    = { fg = "#eae0e4" }
footer = { fg = "#3f293b", bg = "#debdd4" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#b3d186" },

    # Media
    { mime = "{audio,video}/*", fg = "#debdd4" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#f3b2e5" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffb4ab" },

    # Fallback
    { url = "*", fg = "#eae0e4" },
    { url = "*/", fg = "#f3b2e5" },
]

# : ]]]


