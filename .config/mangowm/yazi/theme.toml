    { name = "Música", text = "", fg = "#bcc6e3" },
    { name = "Imagenes", text = "", fg = "#bcc6e3" },
    { name = "Vídeos", text = "", fg = "#bcc6e3" },
    { name = "Plantillas", text = "", fg = "#bcc6e3" },
    { name = "Público", text = "", fg = "#bcc6e3" },
