# : Manager [[[

[mgr]
cwd = { fg = "#e5e2e3" }

# Find
find_keyword  = { fg = "#d7c4aa", bold = true, italic = true, underline = true }
find_position = { fg = "#d7c4aa", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#c1c6d6", bg = "#c1c6d6" }
marker_cut      = { fg = "#c5c6cd", bg = "#c5c6cd" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#d7c4aa", bg = "#d7c4aa" }

# Count
count_copied   = { fg = "#2b313c", bg = "#c1c6d6" }
count_cut      = { fg = "#2e3036", bg = "#c5c6cd" }
count_selected = { fg = "#3a2e1d", bg = "#d7c4aa" }

# Border
border_symbol = "│"
border_style  = { fg = "#8f9096" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "", close = "" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#c1c6d6", bold = true, bg = "#131314" }
inactive  = { fg = "#c6c6cc", bg = "#131314" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#c1c6d6", fg = "#2b313c", bold = true }
normal_alt  = { bg = "#45474c", fg = "#c6c6cc" }

# Select mode
select_main = { bg = "#c5c6cd", fg = "#2e3036", bold = true }
select_alt  = { bg = "#45474c", fg = "#c6c6cc" }

# Unset mode
unset_main = { bg = "#d7c4aa", fg = "#3a2e1d", bold = true }
unset_alt  = { bg = "#45474c", fg = "#c6c6cc" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type  = { fg = "#d7c4aa" }
perm_write = { fg = "#c1c6d6" }
perm_read  = { fg = "#ffb4ab" }
perm_exec  = { fg = "#c5c6cd" }
perm_sep   = { fg = "#8f9096" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#c1c6d6", bg = "#45474c" }
progress_error  = { fg = "#ffb4ab", bg = "#45474c" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#45474c" }
cand = { fg = "#c1c6d6" }
rest = { fg = "#bcc2d1" }
desc = { fg = "#e5e2e3" }
separator = " ▶ "
separator_style = { fg = "#e5e2e3" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#c5c6cd" }
title_warn  = { fg = "#d7c4aa" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#8f9096" }
active = { fg = "#c1c6d6", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#8f9096" }
value  = { fg = "#e5e2e3" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#8f9096", bg = "#131314" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#8f9096" }
title   = {}
hovered = { fg = "#c1c6d6", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e5e2e3" }
run    = { fg = "#e5e2e3" }
footer = { fg = "#2e3036", bg = "#c5c6cd" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#d7c4aa" },

    # Media
    { mime = "{audio,video}/*", fg = "#c5c6cd" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#c1c6d6" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffb4ab" },

    # Fallback
    { url = "*", fg = "#e5e2e3" },
    { url = "*/", fg = "#c1c6d6" },
]

# : ]]]


