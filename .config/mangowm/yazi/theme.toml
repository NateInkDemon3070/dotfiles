# : Manager [[[

[mgr]
cwd = { fg = "#e6e1e3" }

# Find
find_keyword  = { fg = "#d3c6a4", bold = true, italic = true, underline = true }
find_position = { fg = "#d3c6a4", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#cbc3d9", bg = "#cbc3d9" }
marker_cut      = { fg = "#cac4ce", bg = "#cac4ce" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#d3c6a4", bg = "#d3c6a4" }

# Count
count_copied   = { fg = "#322e3f", bg = "#cbc3d9" }
count_cut      = { fg = "#322f37", bg = "#cac4ce" }
count_selected = { fg = "#373018", bg = "#d3c6a4" }

# Border
border_symbol = "│"
border_style  = { fg = "#938f96" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "", close = "" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#cbc3d9", bold = true, bg = "#141314" }
inactive  = { fg = "#cac5cc", bg = "#141314" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#cbc3d9", fg = "#322e3f", bold = true }
normal_alt  = { bg = "#48464c", fg = "#cac5cc" }

# Select mode
select_main = { bg = "#cac4ce", fg = "#322f37", bold = true }
select_alt  = { bg = "#48464c", fg = "#cac5cc" }

# Unset mode
unset_main = { bg = "#d3c6a4", fg = "#373018", bold = true }
unset_alt  = { bg = "#48464c", fg = "#cac5cc" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type  = { fg = "#d3c6a4" }
perm_write = { fg = "#cbc3d9" }
perm_read  = { fg = "#ffb4ab" }
perm_exec  = { fg = "#cac4ce" }
perm_sep   = { fg = "#938f96" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#cbc3d9", bg = "#48464c" }
progress_error  = { fg = "#ffb4ab", bg = "#48464c" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#48464c" }
cand = { fg = "#cbc3d9" }
rest = { fg = "#a59eb3" }
desc = { fg = "#e6e1e3" }
separator = " ▶ "
separator_style = { fg = "#e6e1e3" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#cac4ce" }
title_warn  = { fg = "#d3c6a4" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#938f96" }
active = { fg = "#cbc3d9", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#938f96" }
value  = { fg = "#e6e1e3" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#938f96", bg = "#141314" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#938f96" }
title   = {}
hovered = { fg = "#cbc3d9", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#e6e1e3" }
run    = { fg = "#e6e1e3" }
footer = { fg = "#322f37", bg = "#cac4ce" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#d3c6a4" },

    # Media
    { mime = "{audio,video}/*", fg = "#cac4ce" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#cbc3d9" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffb4ab" },

    # Fallback
    { url = "*", fg = "#e6e1e3" },
    { url = "*/", fg = "#cbc3d9" },
]

# : ]]]


# : Iconos personalizados XDG dirs en español + Juegos [[[
[icon]
prepend_dirs = [
    { name = "Escritorio", text = "", fg = "#cbc3d9" },
    { name = "Descargas", text = "", fg = "#cbc3d9" },
    { name = "Documentos", text = "", fg = "#cbc3d9" },
    { name = "Música", text = "", fg = "#cbc3d9" },
    { name = "Imagenes", text = "", fg = "#cbc3d9" },
    { name = "Vídeos", text = "", fg = "#cbc3d9" },
    { name = "Plantillas", text = "", fg = "#cbc3d9" },
    { name = "Público", text = "", fg = "#cbc3d9" },
    { name = "Juegos", text = "", fg = "#cbc3d9" },
]
prepend_conds = [
    { if = "dir & hovered", text = "", fg = "#cbc3d9" },
    { if = "dir", text = "", fg = "#cbc3d9" },
]
# : ]]]
