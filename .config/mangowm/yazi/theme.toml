# : Manager [[[

[mgr]
cwd = { fg = "#efdfdc" }

# Find
find_keyword  = { fg = "#7cd7bf", bold = true, italic = true, underline = true }
find_position = { fg = "#7cd7bf", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#ffb4a6", bg = "#ffb4a6" }
marker_cut      = { fg = "#eebbb1", bg = "#eebbb1" }
marker_marked   = { fg = "#ffb4ab", bg = "#ffb4ab" }
marker_selected = { fg = "#7cd7bf", bg = "#7cd7bf" }

# Count
count_copied   = { fg = "#591c12", bg = "#ffb4a6" }
count_cut      = { fg = "#482822", bg = "#eebbb1" }
count_selected = { fg = "#00382d", bg = "#7cd7bf" }

# Border
border_symbol = "│"
border_style  = { fg = "#a28c88" }

# : ]]]


# : Indicator [[[

[indicator]
padding = { open = "", close = "" }

# : ]]]


# : Tabs [[[

[tabs]
active    = { fg = "#ffb4a6", bold = true, bg = "#191210" }
inactive  = { fg = "#dac1bd", bg = "#191210" }
sep_inner = { open = "[", close = "]" }

# : ]]]


# : Mode [[[

[mode]
# Mode
normal_main = { bg = "#ffb4a6", fg = "#591c12", bold = true }
normal_alt  = { bg = "#544340", fg = "#dac1bd" }

# Select mode
select_main = { bg = "#eebbb1", fg = "#482822", bold = true }
select_alt  = { bg = "#544340", fg = "#dac1bd" }

# Unset mode
unset_main = { bg = "#7cd7bf", fg = "#00382d", bold = true }
unset_alt  = { bg = "#544340", fg = "#dac1bd" }

# : ]]]


# : Status [[[

[status]
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type  = { fg = "#7cd7bf" }
perm_write = { fg = "#ffb4a6" }
perm_read  = { fg = "#ffb4ab" }
perm_exec  = { fg = "#eebbb1" }
perm_sep   = { fg = "#a28c88" }

# Progress
progress_label  = { bold = true }
progress_normal = { fg = "#ffb4a6", bg = "#544340" }
progress_error  = { fg = "#ffb4ab", bg = "#544340" }

# : ]]]


# : Which [[[

[which]
cols = 3
mask = { bg = "#544340" }
cand = { fg = "#ffb4a6" }
rest = { fg = "#240100" }
desc = { fg = "#efdfdc" }
separator = " ▶ "
separator_style = { fg = "#efdfdc" }

# : ]]]


# : Notify [[[

[notify]
title_info  = { fg = "#eebbb1" }
title_warn  = { fg = "#7cd7bf" }
title_error = { fg = "#ffb4ab" }

# : ]]]


# : Picker [[[

[pick]
border = { fg = "#a28c88" }
active = { fg = "#ffb4a6", bold = true }
inactive = {}

# : ]]]


# : Input [[[

[input]
border = { fg = "#a28c88" }
value  = { fg = "#efdfdc" }

# : ]]]


# : Completion [[[

[cmp]
border = { fg = "#a28c88", bg = "#191210" }

# : ]]]


# : Tasks [[[

[tasks]
border  = { fg = "#a28c88" }
title   = {}
hovered = { fg = "#ffb4a6", underline = true }

# : ]]]


# : Help [[[

[help]
on     = { fg = "#efdfdc" }
run    = { fg = "#efdfdc" }
footer = { fg = "#482822", bg = "#eebbb1" }

# : ]]]


# : File-specific styles [[[

[filetype]

rules = [
    # Images
    { mime = "image/*", fg = "#7cd7bf" },

    # Media
    { mime = "{audio,video}/*", fg = "#eebbb1" },

    # Archives
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb4ab" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#ffb4a6" },

    # Special files
    { url = "*", is = "orphan", bg = "#93000a" },
    { url = "*", is = "exec", fg = "#ffb4ab" },

    # Fallback
    { url = "*", fg = "#efdfdc" },
    { url = "*/", fg = "#ffb4a6" },
]

# : ]]]


# : Iconos personalizados XDG dirs en español + Juegos [[[
[icon]
prepend_dirs = [
    { name = "Escritorio", text = "", fg = "#ffb4a6" },
    { name = "Descargas", text = "", fg = "#ffb4a6" },
    { name = "Documentos", text = "", fg = "#ffb4a6" },
    { name = "Música", text = "", fg = "#ffb4a6" },
    { name = "Imagenes", text = "", fg = "#ffb4a6" },
    { name = "Vídeos", text = "", fg = "#ffb4a6" },
    { name = "Plantillas", text = "", fg = "#ffb4a6" },
    { name = "Público", text = "", fg = "#ffb4a6" },
    { name = "Juegos", text = "", fg = "#ffb4a6" },
]
prepend_conds = [
    { if = "dir & hovered", text = "", fg = "#ffb4a6" },
    { if = "dir", text = "", fg = "#ffb4a6" },
]
# : ]]]
