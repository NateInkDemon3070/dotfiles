# Mi config de mangowc :3

# ── SERVICIOS DE ARRANQUE ─────────────────────────────────────────────
exec_once=bash /home/jpablo/.config/mango/scripts/autostart.sh

# ── MONITOR ──────────────────────────────────────────────
monitor_rule=name:.*,width:1366,height:768,refresh:60,scale:1

# ── FOCO / RATÓN ─────────────────────────────────────────
sloppy_focus=1
warp_cursor=0
focus_on_activate=1

# ── TECLADO ──────────────────────────────────────────────
xkb_rules_layout=us
xkb_rules_variant=intl
xkb_rules_options=lv3:lalt_switch

# ── TOUCHPAD ─────────────────────────────────────────────
tap_to_click=1
trackpad_natural_scrolling=0

# ── BORDES Y ESPACIADOS ──────────────────────────────────
border_px=2
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=4
gap_outer_vertical=4

# ── EFECTOS ────────────────────────────────────────────
animation_duration_open=205
animation_duration_close=205
animation_duration_move=205
animation_duration_tag=205
animation_duration_focus=0

border_radius=0
no_radius_when_single=0

blur=1
blur_optimized=1
blur_params_num_passes=1
blur_params_radius=2
blur_layer=1

# ── CURSOR ───────────────────────────────────────────────
cursor_theme=Hatsune-Miku-cursors
cursor_size=22

# REGLAS DE VENTANA
window_rule=is_floating:1,width:700,height:500,app_id:nwg-look
window_rule=is_floating:1,width:700,height:500,app_id:lxqt-policykit-agent
window_rule=is_floating:1,width:700,height:500,app_id:floating_tui
window_rule=is_floating:1,width:800,height:600,app_id:pavucontrol
window_rule=is_floating:1,width:600,height:400,app_id:blueman-manager

# blur
window_rule=focused_opacity:0.85,unfocused_opacity:0.85,app_id:thunar
window_rule=focused_opacity:0.85,unfocused_opacity:0.85,app_id:zen

# LAYER RULES
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=no_blur:1,layer_name:^waybar
layer_rule=animation_type_open:zoom,layer_name:swaync-control-center
layer_rule=animation_type_open:zoom,layer_name:swaync-notification-window

# ATAJOS DE TECLADO

# Generales
bind=SUPER,Return,spawn,kitty
bind=SUPER,q,killclient
bind=SUPER+SHIFT,q,minimized
bind=SUPER+SHIFT,s,toggle_scratchpad
bind=SUPER,e,spawn,kitty yazi
bind=SUPER,b,spawn,zen-browser
bind=SUPER,m,spawn,kitty rmpc 
bind=SUPER,n,spawn,eww open music-widget --toggle
bind=SUPER,t,togglefloating
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER,f,togglefullscreen
bind=SUPER+SHIFT,Escape,killclient,force
bind=SUPER,Escape,spawn,bash /home/jpablo/.config/mango/scripts/powermenu.sh
bind=SUPER+SHIFT,e,spawn,kitty sudo yazi
bind=SUPER+SHIFT,c,spawn,killall -9 mango

bind=SUPER,period,spawn,rofimoji --action copy --selector rofi --selector-args "-theme ~/.config/rofi/config.rasi"
bind=SUPER,w,spawn,sh /home/jpablo/.config/mango/scripts/wallpaper.sh
bind=SUPER+SHIFT,w,spawn,bash /home/jpablo/.config/mango/scripts/wallpaper_select.sh
bind=SUPER,o,spawn,bash /home/jpablo/.config/waybar/scripts/switch_waybar.sh
bind=SUPER+SHIFT,o,spawn,bash /home/jpablo/.config/mango/scripts/toggle-waybar.sh
bind=SUPER,v,spawn_shell,cliphist list | rofi -dmenu -p "Portapapeles" -theme ~/.config/rofi/config.rasi | cliphist decode | wl-copy

# laburo
bind=SUPER+CTRL+ALT+SHIFT,l,spawn,firefox https://linkedin.com

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

key_mode=resize
bind=NONE,Left,resizewin,-10,0
bind=NONE,Right,resizewin,+10,0
bind=NONE,Up,resizewin,0,-10
bind=NONE,Down,resizewin,0,+10
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default
key_mode=default

# Tags
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER+SHIFT,1,tag,1,1
bind=SUPER+SHIFT,2,tag,2,1
bind=SUPER+SHIFT,3,tag,3,1
bind=SUPER+SHIFT,4,tag,4,1
bind=SUPER+SHIFT,5,tag,5,1

axisbind=SUPER,LEFT,viewtoleft
axisbind=SUPER,RIGHT,viewtoright

axisbind=SUPER+SHIFT,LEFT,tagtoleft
axisbind=SUPER+SHIFT,RIGHT,tagtoright

# Mover/redimensionar ventanas flotantes
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Volumen / brillo
bind=NONE,XF86AudioRaiseVolume,spawn,swayosd-client --output-volume raise
bind=NONE,XF86AudioLowerVolume,spawn,swayosd-client --output-volume lower
bind=NONE,XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
bind=NONE,XF86AudioMicMute,spawn,swayosd-client --input-volume mute-toggle
bind=NONE,XF86MonBrightnessUp,spawn,swayosd-client --brightness raise
bind=NONE,XF86MonBrightnessDown,spawn,swayosd-client --brightness lower

# Capturas de pantalla
bind=NONE,Print,spawn,flameshot full -p /home/jpablo/Imagenes/Capturas/
bind=SUPER,Print,spawn,flameshot full -c
bind=SHIFT,Print,spawn,flameshot gui -p /home/jpablo/Imagenes/Capturas
bind=SUPER+SHIFT,Print,spawn,flameshot gui -c
bind=SUPER+CTRL,Print,spawn,flameshot gui -p /home/jpablo/Imagenes/Capturas -d 500

tag_rule=id:*,layout_name:fair
circle_layout=fair

# ── COLORES DE LOS BORDES Y DEMÁS ───────────────────────────────────
source=/home/jpablo/.config/mango/colors.conf
